[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
arc_testnet = "https://rpc.testnet.arc.io"
base_sepolia = "https://sepolia.base.org"

[fmt]
line_length = 110
